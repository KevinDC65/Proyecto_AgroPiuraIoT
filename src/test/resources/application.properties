spring.application.name=AgroPiuraIoT-Test

# H2 en memoria con compatibilidad PostgreSQL para tests autónomos
spring.datasource.url=jdbc:h2:mem:agropiura;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Clima desactivado en tests para evitar llamadas remotas
clima.openweather.api-key=
