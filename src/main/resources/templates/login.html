<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: head('Ingresar')}"></head>
<body class="publico">
<div th:replace="~{components/layout :: topPublico}"></div>
<main class="auth-card">
    <h1>AgroPiura IoT</h1>
    <p class="auth-sub">Ingresa para ver tus parcelas</p>
    <p class="alerta exito" th:if="${param.registrado}">Cuenta creada. Ingresa con tu correo y contraseña.</p>
    <p class="alerta error" th:if="${param.error}">Correo o contraseña incorrectos.</p>
    <form th:action="@{/login}" method="post" class="form">
        <label>Correo electrónico
            <input type="email" name="username" placeholder="nombre@correo.com" required maxlength="150" autofocus>
        </label>
        <label>Contraseña
            <input type="password" name="password" placeholder="••••••••" required>
        </label>
        <div class="olvido"><span>¿Olvidaste tu contraseña? Disponible pronto</span></div>
        <button class="btn" type="submit">Ingresar</button>
    </form>
    <p class="auth-alt">¿No tienes cuenta? <a th:href="@{/registro}">Crear cuenta</a></p>
</main>
</body>
</html>
