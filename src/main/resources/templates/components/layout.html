<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | AgroPiura IoT'">AgroPiura IoT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <!-- Barra superior de vistas públicas -->
    <div th:fragment="topPublico">
        <div class="top-publico">
            <a class="marca" th:href="@{/}">AgroPiura IoT</a>
            <div class="top-publico-acciones">
                <a sec:authorize="isAuthenticated()" class="volver" th:href="@{/dashboard}">Ir al Dashboard &rarr;</a>
                <a sec:authorize="isAnonymous()" class="volver" th:href="@{/}">Volver</a>
            </div>
        </div>
    </div>

    <!-- Header superior para vistas autenticadas -->
    <header th:fragment="header" class="top-header" sec:authorize="isAuthenticated()">
        <div class="header-left">
            <span class="header-saludo">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="suave">Conectado como:</span>
                <strong class="usuario-correo" sec:authentication="name">usuario@agropiura.com</strong>
            </span>
        </div>
        <div class="header-right">
            <a class="header-notif" th:href="@{/alertas}" title="Alertas y notificaciones">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
                </svg>
                <span class="nav-badge" th:if="${notificacionesPendientes != null and notificacionesPendientes > 0}"
                      th:text="${notificacionesPendientes}"></span>
            </a>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="btn fantasma chico btn-salir">Cerrar Sesión</button>
            </form>
        </div>
    </header>

    <!-- Sidebar de la app (activo = sección actual).
         Iconos SVG de una sola línea: heredan el color del texto y miden lo mismo. -->
    <aside th:fragment="sidebar(activo)" class="sidebar">
        <a class="marca" th:href="@{/dashboard}">AgroPiura IoT</a>
        <a class="nav-item" th:classappend="${activo} == 'dashboard' ? ' activo'" th:href="@{/dashboard}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
            Dashboard
        </a>
        <a class="nav-item" th:classappend="${activo} == 'cultivos' ? ' activo'" th:href="@{/cultivos}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6Z"/><path d="M12 15c0-3-2.5-5-6-5 0 3 2.5 5 6 5Z"/></svg>
            Cultivos
        </a>
        <a class="nav-item" th:classappend="${activo} == 'umbrales' ? ' activo'" th:href="@{/umbrales}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 12h2"/><path d="M10 12h10"/><circle cx="8" cy="12" r="2"/><path d="M4 18h10"/><path d="M18 18h2"/><circle cx="16" cy="18" r="2"/></svg>
            Umbrales
        </a>
        <a class="nav-item" th:classappend="${activo} == 'alertas' ? ' activo'" th:href="@{/alertas}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            Alertas
            <span class="nav-badge" th:if="${notificacionesPendientes != null and notificacionesPendientes > 0}"
                th:text="${notificacionesPendientes}"></span>
        </a>
        <a class="nav-item" th:classappend="${activo} == 'historico' ? ' activo'" th:href="@{/historico}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>
            Histórico
        </a>
        <a class="nav-item" th:classappend="${activo} == 'mapa' ? ' activo'" th:href="@{/mapa}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
            Mapa
        </a>
        <a class="nav-item" th:classappend="${activo} == 'portada' ? ' activo'" th:href="@{/}">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Portada
        </a>
        <span class="nav-item pronto">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>
            Pagos<span class="sello-pronto">Pronto</span>
        </span>
        <div sec:authorize="isAuthenticated()" style="margin-top:1rem">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn fantasma chico" style="width:100%">Salir</button>
            </form>
        </div>
        <div class="plan-card"><strong>Plan Productor</strong><span>S/ 129 al mes</span></div>
    </aside>
</body>

</html>
