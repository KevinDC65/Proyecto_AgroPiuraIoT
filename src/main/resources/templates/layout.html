<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | AgroPiura IoT'">AgroPiura IoT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!-- Barra superior de vistas públicas -->
<div th:fragment="topPublico">
    <div class="top-publico">
        <a class="marca" th:href="@{/}">AgroPiura IoT</a>
        <a class="volver" th:href="@{/}">Volver</a>
    </div>
</div>
<!-- Sidebar de la app (activo = sección actual; resto del mockup como Pronto) -->
<aside th:fragment="sidebar(activo)" class="sidebar">
    <a class="marca" th:href="@{/dashboard}">AgroPiura IoT</a>
    <a class="nav-item" th:classappend="${activo} == 'dashboard' ? ' activo'" th:href="@{/dashboard}">⌂ Dashboard</a>
    <a class="nav-item" th:classappend="${activo} == 'cultivos' ? ' activo'" th:href="@{/cultivos}">◫ Cultivos</a>
    <span class="nav-item pronto">◔ Umbrales<span class="sello-pronto">Pronto</span></span>
    <span class="nav-item pronto">⚠ Alertas<span class="sello-pronto">Pronto</span></span>
    <span class="nav-item pronto">📈 Histórico<span class="sello-pronto">Pronto</span></span>
    <span class="nav-item pronto">💳 Pagos<span class="sello-pronto">Pronto</span></span>
    <div sec:authorize="isAuthenticated()" style="margin-top:1rem">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn fantasma chico">Salir</button>
        </form>
    </div>
    <div class="plan-card"><strong>Plan Productor</strong><span>S/ 129 al mes</span></div>
</aside>
</body>
</html>
