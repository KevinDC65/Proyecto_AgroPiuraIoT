<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: head('Solicitud no válida')}"></head>
<body class="publico">
<header th:replace="~{components/layout :: topPublico}"></header>
<main class="error-pagina">
    <span class="error-codigo" th:text="${status} ?: '400'">400</span>
    <h1>No pudimos procesar la solicitud</h1>
    <p>Revisa los datos enviados e inténtalo de nuevo.</p>
    <p class="error-ruta" th:if="${path}" th:text="${path}">/ruta</p>
    <div class="form-acciones">
        <a class="btn primario" th:href="@{/dashboard}">Ir al resumen</a>
        <a class="btn secundario" th:href="@{/}">Volver al inicio</a>
    </div>
</main>
</body>
</html>
