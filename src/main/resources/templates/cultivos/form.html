<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: head(${cultivoId} == null ? 'Nuevo cultivo' : 'Editar cultivo')}"></head>
<body class="app">
<div class="shell">
    <aside th:replace="~{components/layout :: sidebar('cultivos')}"></aside>
    <main class="principal">
        <header th:replace="~{components/layout :: header}"></header>
        <span class="migas">Inicio &gt; <a th:href="@{/cultivos}" style="color:#fff">Cultivos</a> &gt; <span th:text="${cultivoId} == null ? 'Nuevo cultivo' : 'Editar cultivo'"></span></span>
        <h1 th:text="${cultivoId} == null ? 'Nuevo cultivo' : 'Editar cultivo'"></h1>
        <div class="card" style="max-width:560px">
            <form th:action="${cultivoId} == null ? @{/cultivos} : @{/cultivos/{id}/editar(id=${cultivoId})}"
                  th:object="${form}" method="post" class="form">
                <label>Nombre
                    <input type="text" th:field="*{nombre}" maxlength="150" required placeholder="Ej. Parcela Norte Mango">
                    <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                </label>
                <label>Tipo de cultivo (mango, limón, arroz, banano…)
                    <input type="text" th:field="*{tipoCultivo}" maxlength="100" required placeholder="Ej. mango">
                    <span class="error" th:if="${#fields.hasErrors('tipoCultivo')}" th:errors="*{tipoCultivo}"></span>
                </label>
                <label>Zona / Ubicación
                    <input type="text" th:field="*{ubicacion}" maxlength="200" placeholder="Ej. Chulucanas, Piura">
                    <span class="error" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}"></span>
                </label>
                <label>Área (ha)
                    <input type="number" step="0.01" min="0" th:field="*{areaHa}" placeholder="Ej. 3.2">
                    <span class="error" th:if="${#fields.hasErrors('areaHa')}" th:errors="*{areaHa}"></span>
                </label>
                <div class="form-fila">
                    <label>Latitud
                        <input type="number" step="0.000001" min="-90" max="90" th:field="*{latitud}" placeholder="Ej. -5.194">
                        <span class="error" th:if="${#fields.hasErrors('latitud')}" th:errors="*{latitud}"></span>
                    </label>
                    <label>Longitud
                        <input type="number" step="0.000001" min="-180" max="180" th:field="*{longitud}" placeholder="Ej. -80.633">
                        <span class="error" th:if="${#fields.hasErrors('longitud')}" th:errors="*{longitud}"></span>
                    </label>
                </div>
                <div class="grupo-botones" style="margin-top:0.5rem">
                    <button class="btn" type="submit">Guardar</button>
                    <a class="btn claro chico" th:href="@{/cultivos}">Cancelar</a>
                </div>
            </form>
        </div>
        <p><a class="enlace-claro" th:href="@{/cultivos}">&larr; Volver al listado de cultivos</a></p>
    </main>
</div>
</body>
</html>
