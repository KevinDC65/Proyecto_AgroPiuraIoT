<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: head('Cultivos')}"></head>
<body class="app">
<div class="shell">
    <aside th:replace="~{components/layout :: sidebar('cultivos')}"></aside>
    <main class="principal">
        <header th:replace="~{components/layout :: header}"></header>
        <div class="fila-titulo">
            <span class="migas">Inicio &gt; Cultivos</span>
            <div class="grupo-botones">
                <a class="btn claro chico" th:href="@{/cultivos/exportar.xlsx}">Exportar Excel</a>
                <a class="btn" th:href="@{/cultivos/nuevo}">+ Nuevo cultivo</a>
            </div>
        </div>
        <h1>Cultivos</h1>
        <p class="alerta exito" th:if="${mensaje}" th:text="${mensaje}"></p>
        <p class="alerta error" th:if="${error}" th:text="${error}"></p>
        <div class="card">
            <p th:if="${#lists.isEmpty(cultivos)}">
                Aún no hay cultivos registrados. Usa «+ Nuevo cultivo» para agregar el primero.
            </p>
            <table class="tabla" th:unless="${#lists.isEmpty(cultivos)}">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Zona</th>
                    <th>Área (ha)</th>
                    <th>Dispositivo</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${cultivos}">
                    <td class="fuerte" th:text="${c.nombre}"></td>
                    <td th:text="${c.tipoCultivo}"></td>
                    <td th:text="${c.ubicacion} ?: '-'"></td>
                    <td th:text="${c.areaHa} ?: '-'"></td>
                    <td>
                        <span class="badge badge-ok" th:if="${!#sets.isEmpty(c.dispositivos)}">Activo</span>
                        <span class="badge badge-mutes" th:if="${#sets.isEmpty(c.dispositivos)}">Inactivo</span>
                    </td>
                    <td>
                        <div class="grupo-botones">
                            <a class="btn claro chico" th:href="@{/cultivos/{id}(id=${c.idCultivo})}">Detalle</a>
                            <a class="btn claro chico" th:href="@{/cultivos/{id}/editar(id=${c.idCultivo})}">Editar</a>
                            <form th:action="@{/cultivos/{id}/eliminar(id=${c.idCultivo})}" method="post" class="inline"
                                  onsubmit="return confirm('¿Eliminar este cultivo?');">
                                <button class="btn claro chico" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
