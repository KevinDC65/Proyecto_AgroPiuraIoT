<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/layout :: head('Alertas')}"></head>
<body class="app">
<div class="shell">
    <aside th:replace="~{components/layout :: sidebar('alertas')}"></aside>
    <main class="principal">
        <span class="migas">Inicio &gt; Alertas</span>
        <h1>Alertas</h1>

        <p class="alerta exito" th:if="${mensaje}" th:text="${mensaje}"></p>

        <div class="card">
            <h2>Mis notificaciones sin leer</h2>
            <p th:if="${#lists.isEmpty(notificaciones)}">No tienes notificaciones pendientes.</p>
            <div th:unless="${#lists.isEmpty(notificaciones)}">
                <div class="alerta error" th:each="n : ${notificaciones}"
                     style="margin-bottom:0.5rem; display:flex; align-items:center; gap:0.8rem;">
                    <span th:text="${n.alerta.umbral.cultivo.nombre} + ': ' + ${n.alerta.mensaje}"></span>
                    <form th:action="@{/alertas/{id}/leida(id=${n.idNotificacion})}" method="post" class="inline">
                        <button class="btn claro chico" type="submit">Marcar como leída</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Historial de alertas</h2>
            <p th:if="${#lists.isEmpty(alertas)}">Aún no se han generado alertas en el sistema.</p>
            <table class="tabla" th:unless="${#lists.isEmpty(alertas)}">
                <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Cultivo</th>
                    <th>Variable</th>
                    <th>Mensaje</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${alertas}">
                    <td th:text="${a.fechaAlerta}"></td>
                    <td>
                        <a style="color: var(--teal-800); font-weight: 600;"
                           th:href="@{/cultivos/{id}/umbrales(id=${a.umbral.cultivo.idCultivo})}"
                           th:text="${a.umbral.cultivo.nombre}"></a>
                    </td>
                    <td th:text="${a.umbral.tipoSensor.obtenerNombre()}"></td>
                    <td th:text="${a.mensaje}"></td>
                    <td>
                        <span class="badge badge-alerta" th:if="${!a.atendida}">Pendiente</span>
                        <span class="badge badge-ok" th:if="${a.atendida}">Atendida</span>
                    </td>
                    <td>
                        <form th:if="${!a.atendida}"
                              th:action="@{/alertas/{id}/atender(id=${a.idAlerta})}"
                              method="post" class="inline">
                            <button class="btn claro chico" type="submit">Marcar como atendida</button>
                        </form>
                        <span th:if="${a.atendida}" class="suave">—</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
