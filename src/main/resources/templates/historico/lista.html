<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Histórico')}"></head>
<body class="app">
<div class="shell">
    <aside th:replace="~{components/layout :: sidebar('historico')}"></aside>
    <main class="principal">
        <span class="migas">Inicio > Cultivos > <span th:text="${cultivo.nombre}"></span> > Histórico</span>
        <h1 th:text="'Histórico de ' + ${cultivo.nombre}"></h1>

        <div class="card" style="margin-bottom:1rem">
            <h2>Filtrar</h2>
            <form method="get" class="form inline" style="gap:0.8rem">
                <label>Desde <input type="date" name="desde" th:value="${desde}"></label>
                <label>Hasta <input type="date" name="hasta" th:value="${hasta}"></label>
                <button class="btn" type="submit">Aplicar</button>
                <a class="btn claro" th:href="@{'/cultivos/' + ${cultivo.idCultivo} + '/historico'}">Limpiar</a>
                <a class="btn claro" th:href="@{'/cultivos/' + ${cultivo.idCultivo} + '/historico/exportar.xlsx'} (desde=${desde}, hasta=${hasta})">Exportar Excel</a>
            </form>
        </div>

        <div class="card" style="height:400px; position:relative">
            <h2>Serie temporal</h2>
            <p th:if="${#lists.isEmpty(puntos)}">Sin lecturas en el rango seleccionado.</p>
            <canvas th:unless="${#lists.isEmpty(puntos)}" id="chartHistorico"
                    style="width:100%; height:340px"></canvas>
        </div>

        <div class="card">
            <h2>Tabla de lecturas</h2>
            <p th:if="${#lists.isEmpty(lecturas)}">No hay lecturas registradas.</p>
            <table class="tabla" th:unless="${#lists.isEmpty(lecturas)}">
                <thead><tr><th>Fecha y hora</th><th>Variable</th><th>Valor</th><th>Unidad</th><th>Umbral</th><th>Estado</th></tr></thead>
                <tbody>
                <tr th:each="l : ${lecturas}">
                    <td th:text="${l.fechaHora}"></td>
                    <td th:text="${l.sensor.tipoSensor.obtenerNombre()}"></td>
                    <td th:text="${l.valor}"></td>
                    <td th:text="${l.sensor.tipoSensor.unidadMedida}"></td>
                    <td th:if="${l.sensor.tipoSensor.obtenerNombre()}">-</td>
                    <td>
                        <span class="badge" th:classappend="${l.estaFueraDeRango(null)} ? 'badge-alerta' : 'badge-ok'"
                            th:text="${l.estaFueraDeRango(null)} ? 'FUERA DE RANGO' : 'dentro de rango'}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <p><a style="color:#fff" th:href="@{'/cultivos/' + ${cultivo.idCultivo}}">Volver al detalle del cultivo</a></p>
    </main>
</div>

<script th:unless="${#lists.isEmpty(puntos)}" th:inline="javascript">
/*<![CDATA[*/
const datos = /*[[${puntos}]]*/ [];
const etiquetas = datos.map(p => p.fechaHora);
const series = {};

datos.forEach(p => {
    if (!series[p.variable]) series[p.variable] = [];
    series[p.variable].push(p.valor);
});

const colores = ['#0d9488', '#ea580c', '#7c3aed', '#e11d48'];
let i = 0;
new Chart(document.getElementById('chartHistorico'), {
    type: 'line',
    data: {
        labels: etiquetas,
        datasets: Object.entries(series).map(([nombre, valores]) => ({
            label: nombre,
            data: valores,
            borderColor: colores[i++ % colores.length],
            backgroundColor: colores[i % colores.length] + '33',
            tension: 0.2,
            fill: true
        }))
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: true } },
        scales: { x: { ticks: { maxRotation: 45, minRotation: 45 } } }
    }
});
/*]]>*/
</script>

<script th:href="@{/js/chart.umd.min.js}" th:unless="${#lists.isEmpty(puntos)}"></script>
</body>
</html>
